# Role-kind classifier. Sorts each posting into what the JOB actually is, so
# the owner (a Unifier SYSTEMS person — admin/config/integration/development)
# can hide construction-delivery and scheduling roles that merely mention
# Unifier in boilerplate. Bechtel's welding/piping field engineers and Turner
# & Townsend's schedulers are the motivating cases.
#
# NOT a displayed fact about the posting — a derived tag, same category as the
# NYC/metro sort bucket. Hard rule #1 is untouched: title, comp, location and
# description still render verbatim.
#
# Scoring: a title hit is worth `title_weight`, a description hit 1. Highest
# scoring kind wins; ties and total-zero => "unclear" (never hidden by
# accident — the owner filters on what they trust).
title_weight: 6
min_score: 3

kinds:
  # What the owner IS looking for: configuring/building/running the system.
  systems:
    title:
      # Highest-precision signal there is: if the TITLE names the product,
      # the job is about the product. No welding superintendent's title says
      # "Unifier". Added after Oracle's "Senior Principal Consultant-Oracle
      # Primavera Unifier", Randstad's "Testing & Training Lead (Oracle
      # Primavera Unifier)" and NYP's "Facilities Systems (Oracle Unifier)"
      # all fell through to "unclear" without it.
      - unifier
      # Same logic as "unifier" above: a title naming the PRODUCT is a job
      # about the product. Added 2026-09-11 for Peloton's "Oracle Primavera
      # Lead" and Project Partners' "Oracle Primavera P6 EPPM and OPC
      # Consultant", both of which sat in "unclear". Safe against the
      # scheduler case: "Primavera P6 Scheduler" would hit systems AND
      # controls, and a tie resolves to "unclear" rather than a wrong bucket.
      - primavera
      - unifier administrator
      - unifier admin
      - unifier developer
      - unifier consultant
      - unifier analyst
      - unifier architect
      - solution architect
      # Architect variants, added 2026-08-12: Meta's "Systems Architect, Data
      # Center Design and Construction" (requires Unifier + P6) scored 1 and
      # fell to "unclear" because only "solution architect" was listed.
      # Deliberately NOT bare "architect" — in this industry that collides
      # with building architects (Project Architect, Design Architect).
      - systems architect
      - system architect
      - technical architect
      - enterprise architect
      - platform architect
      - integration architect
      - application architect
      - data architect
      - functional architect
      - solutions architect
      - delivery architect
      # Names a technology FUNCTION, not a construction one (T&T "Director,
      # Construction Technologies"; Moss "Construction Technologies
      # Integrations Engineer"). Matches Technology and Technologies.
      - construction technolog
      - software engineer
      - systems analyst
      - systems administrator
      - application administrator
      - application analyst
      - technical consultant
      - technical analyst
      - integration
      - developer
      - digital consultant
      - business systems
      - pmis
      - implementation consultant
      - configuration
      - pmis administrator
      - reporting analyst
      - data analyst
      - solutions lead
      - technical lead
    body:
      - udesigner
      - business process setup
      - workflow configuration
      - configure business processes
      - shell hierarchy
      - unifier configuration
      - unifier administration
      - rest api
      - web services
      - oracle integration cloud
      - bi publisher
      - user defined report
      - custom reports
      - data elements
      - sql
      - system administration
      - integrations
      # PMIS implementation/rollout language. Added 2026-07-31: Deloitte's
      # "Sr. Consultant – Capital Projects" is a role the owner actually
      # applied to IRL, but its generic title left it in "unclear" — the
      # systems signal lives entirely in the body ("Leading the configuration
      # and implementation of Project Management Information Systems (PMIS)").
      - pmis
      - project management information system
      - configuration and implementation
      - implementation of project management
      - rollout of systems
      - system implementation
      - systems implementation
      # Unifier's own vocabulary — no construction role uses these words.
      - dynamic data set
      - unifier accelerator
      - custom print
      - data view
      #
      # REMOVED 2026-09-11 — bare sibling-platform names (kahua, ecosys,
      # procore, e-builder, aconex). The old note claimed a competitor list
      # marks platform work; that holds for an implementation consultancy but
      # is FALSE for owner's-rep / CM firms, where those tools are the
      # software site staff USE. Luster's Office Engineer, Change Manager and
      # Resident Engineer each named three of them and tipped straight to the
      # min_score of 3, landing construction jobs in "systems" — the exact
      # thing the owner flagged. The Deloitte case the names were added for
      # does NOT depend on them: it scores on "pmis" + "project management
      # information system" + "configuration and implementation". Do not
      # re-add bare platform names; pair them with build language instead.

  # Construction execution in the field — not the owner's work.
  field:
    title:
      - field engineer
      - superintendent
      - welding
      - piping
      - concrete
      - civil/structural
      - structural engineer
      - electrical field
      - instrument field
      - instrumentation
      - commissioning
      - pre-commissioning
      - craft
      - foreman
      - surveyor
      - safety
      - quality control inspector
      - roadway
      - bridge
      - guideway
      - construction manager
      - site manager
      - subcontracts
      # Added 2026-09-11. These are construction-execution titles that were
      # landing in "systems" (on platform-name hits) or "unclear". A title hit
      # is worth title_weight, so it decides the bucket outright.
      - resident engineer
      - construction inspector
      - utilities coordinator
      - quality manager
      - work control
      - permit writer
      - loto
      - subcontract technical representative
    body:
      - jobsite
      - job site
      - hard hat
      - personal protective equipment
      - osha
      - field conditions
      - construction site
      - walk the site

  # Scheduling / cost / project controls — adjacent, but explicitly not the
  # owner's target ("I'm not a Project Scheduler").
  controls:
    title:
      - scheduler
      - planner
      - project controls
      - program controls
      - cost engineer
      - cost manager
      - cost control
      - estimator
      - claims
      - change specialist
      - document control
      # Construction "change" work is contract/change-order control, and an
      # Office Engineer runs submittals, RFIs and documentation — both are
      # controls, not systems. (An ITIL "Change Manager" would land here too;
      # on this board that is far rarer than the construction sense.)
      - change manager
      - office engineer
    body:
      - critical path method
      - earned value
      - baseline schedule
      - schedule updates
      - cost loading
      - resource loading
